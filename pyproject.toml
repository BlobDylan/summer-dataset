[project]
name = "summer-dataset"
version = "0.1.0"
description = "Movie alignment and viewer for the SUMMER dataset (DANDI 001616)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2",
    "scipy>=1.13",
    "h5py>=3.11",
    "av>=14",              # PyAV: bundles FFmpeg, no system ffmpeg needed
    "soxr>=0.5",           # exact arbitrary-ratio audio resampling
    "webrtcvad-wheels>=2.0.14",
    "pillow>=10",
]

[project.scripts]
summer = "summer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/summer"]
