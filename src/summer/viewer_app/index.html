<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUMMER Viewer</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23f0b429%22/%3E%3C/svg%3E">
</head>
<body>
<header>
  <h1>SUMMER viewer</h1>
  <div id="status"></div>
</header>

<main>
  <section id="player">
    <div id="stage">
      <video id="video" preload="auto" playsinline muted></video>
      <div id="overlay"></div>
    </div>

    <div id="seekwrap">
      <canvas id="seekbar" height="18"></canvas>
    </div>

    <div id="controls">
      <button id="play" title="Play/pause (space)">▶</button>
      <button id="back5" title="-5 s (←)">−5s</button>
      <button id="prevf" title="previous frame (,)">‹ f</button>
      <button id="nextf" title="next frame (.)">f ›</button>
      <button id="fwd5" title="+5 s (→)">+5s</button>
      <span id="clock" class="mono"></span>
      <label>go to frame <input id="goto" type="number" min="0" step="1" class="mono"></label>
      <span class="spacer"></span>
      <label>speed
        <select id="speed">
          <option>0.25</option><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option>
        </select>
      </label>
      <label>audio
        <select id="audiosel"><option value="de">Deutsch</option><option value="en">English</option><option value="off">off</option></select>
      </label>
      <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8" title="volume">
      <label>overlay <select id="overlaysel"><option value="">none</option></select></label>
    </div>

    <div id="now">
      <div id="nowlabels"></div>
      <div id="nowtexts"></div>
    </div>
  </section>

  <aside id="filters">
    <div class="row">
      <label>window
        <select id="window">
          <option value="4">4 s</option><option value="10" selected>10 s</option><option value="30">30 s</option>
          <option value="60">1 min</option><option value="300">5 min</option><option value="1200">20 min</option>
        </select>
      </label>
    </div>
    <div id="trackfilters"></div>
  </aside>
</main>

<section id="timelinewrap">
  <canvas id="timeline"></canvas>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
